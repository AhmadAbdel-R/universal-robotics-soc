<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- PCB Layers -->
  <rect x="50" y="50" width="300" height="20" fill="none" stroke="black" stroke-width="1" />
  <text x="360" y="65" font-family="sans-serif" font-size="12">L1 (Top)</text>

  <rect x="50" y="120" width="300" height="20" fill="none" stroke="black" stroke-width="1" />
  <text x="360" y="135" font-family="sans-serif" font-size="12">L2</text>

  <rect x="50" y="190" width="300" height="20" fill="none" stroke="black" stroke-width="1" />
  <text x="360" y="205" font-family="sans-serif" font-size="12">L3 (Inner Signal)</text>

  <rect x="50" y="260" width="300" height="20" fill="none" stroke="black" stroke-width="1" />
  <text x="360" y="275" font-family="sans-serif" font-size="12">L4 (Bottom)</text>

  <!-- Dielectric filling indication -->
  <line x1="50" y1="50" x2="50" y2="280" stroke="black" stroke-width="2" />
  <line x1="350" y1="50" x2="350" y2="280" stroke="black" stroke-width="2" />

  <!-- Via Plating -->
  <rect x="180" y="50" width="40" height="230" fill="none" stroke="black" stroke-width="2" />
  
  <!-- Signal Flow -->
  <line x1="50" y1="60" x2="190" y2="60" stroke="black" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="200" y1="60" x2="200" y2="200" stroke="black" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="200" y1="200" x2="350" y2="200" stroke="black" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Stub -->
  <rect x="182" y="210" width="36" height="70" fill="none" stroke="black" stroke-dasharray="4,4" stroke-width="2" />
  <line x1="220" y1="245" x2="280" y2="245" stroke="black" stroke-width="1" />
  <text x="290" y="250" font-family="sans-serif" font-size="14" font-weight="bold">VIA STUB</text>

  <!-- Signal Labels -->
  <text x="100" y="45" font-family="sans-serif" font-size="12">Signal IN</text>
  <text x="250" y="185" font-family="sans-serif" font-size="12">Signal OUT</text>
</svg>
