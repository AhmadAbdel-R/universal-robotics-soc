<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  
  <!-- MICROSTRIP -->
  <g transform="translate(50, 50)">
    <text x="100" y="-10" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">MICROSTRIP</text>
    
    <!-- Dielectric -->
    <rect x="0" y="20" width="200" height="60" fill="none" stroke="black" stroke-dasharray="2,2" />
    <text x="100" y="55" text-anchor="middle" font-family="sans-serif" font-size="12">Dielectric</text>
    
    <!-- Trace -->
    <rect x="80" y="10" width="40" height="10" fill="none" stroke="black" stroke-width="2" />
    <text x="100" y="0" text-anchor="middle" font-family="sans-serif" font-size="12">Trace</text>
    
    <!-- GND Plane -->
    <rect x="0" y="80" width="200" height="10" fill="none" stroke="black" stroke-width="2" />
    <text x="100" y="105" text-anchor="middle" font-family="sans-serif" font-size="12">GND Plane</text>
    
    <text x="100" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic">Fields partly in air and dielectric</text>
  </g>

  <!-- SYMMETRIC STRIPLINE -->
  <g transform="translate(300, 50)">
    <text x="100" y="-10" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">SYMMETRIC STRIPLINE</text>
    
    <!-- Top GND -->
    <rect x="0" y="10" width="200" height="10" fill="none" stroke="black" stroke-width="2" />
    <text x="100" y="5" text-anchor="middle" font-family="sans-serif" font-size="12">GND Plane</text>

    <!-- Top Dielectric -->
    <rect x="0" y="20" width="200" height="40" fill="none" stroke="black" stroke-dasharray="2,2" />
    
    <!-- Trace -->
    <rect x="80" y="60" width="40" height="10" fill="none" stroke="black" stroke-width="2" />
    <text x="150" y="70" font-family="sans-serif" font-size="12">Trace</text>
    
    <!-- Bottom Dielectric -->
    <rect x="0" y="70" width="200" height="40" fill="none" stroke="black" stroke-dasharray="2,2" />

    <!-- Bottom GND -->
    <rect x="0" y="110" width="200" height="10" fill="none" stroke="black" stroke-width="2" />
    <text x="100" y="135" text-anchor="middle" font-family="sans-serif" font-size="12">GND Plane</text>

    <text x="100" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic">Fields fully in dielectric</text>
  </g>

  <!-- ASYMMETRIC STRIPLINE -->
  <g transform="translate(550, 50)">
    <text x="100" y="-10" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">ASYMMETRIC STRIPLINE</text>
    
    <!-- Top GND -->
    <rect x="0" y="10" width="200" height="10" fill="none" stroke="black" stroke-width="2" />
    <text x="100" y="5" text-anchor="middle" font-family="sans-serif" font-size="12">GND Plane</text>

    <!-- Thin Dielectric -->
    <rect x="0" y="20" width="200" height="20" fill="none" stroke="black" stroke-dasharray="2,2" />
    
    <!-- Trace -->
    <rect x="80" y="40" width="40" height="10" fill="none" stroke="black" stroke-width="2" />
    <text x="150" y="48" font-family="sans-serif" font-size="12">Trace</text>
    
    <!-- Thick Dielectric -->
    <rect x="0" y="50" width="200" height="80" fill="none" stroke="black" stroke-dasharray="2,2" />

    <!-- Bottom GND -->
    <rect x="0" y="130" width="200" height="10" fill="none" stroke="black" stroke-width="2" />
    <text x="100" y="155" text-anchor="middle" font-family="sans-serif" font-size="12">GND Plane</text>
    
    <text x="100" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic">Offset trace in dielectric</text>
  </g>

</svg>
