<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- Good Placement (Left) -->
  <rect x="50" y="50" width="300" height="200" fill="none" stroke="black" stroke-width="1" />
  <text x="200" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">GOOD: Small High-Frequency Loop</text>
  
  <rect x="150" y="100" width="100" height="80" fill="none" stroke="black" stroke-width="2" />
  <text x="200" y="145" text-anchor="middle" font-family="sans-serif" font-size="14">IC</text>
  <text x="160" y="90" font-family="sans-serif" font-size="12">VDD</text>
  <text x="220" y="90" font-family="sans-serif" font-size="12">GND</text>

  <!-- Capacitor Close -->
  <rect x="160" y="60" width="80" height="10" fill="none" stroke="black" stroke-width="1" />
  <line x1="200" y1="60" x2="200" y2="70" stroke="black" stroke-width="2" />
  <text x="130" y="65" font-family="sans-serif" font-size="12">C</text>

  <!-- Current Loop Small -->
  <path d="M 170 100 L 170 70 L 230 70 L 230 100" fill="none" stroke="black" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke-dasharray="5,5" />
  

  <!-- Bad Placement (Right) -->
  <rect x="450" y="50" width="300" height="200" fill="none" stroke="black" stroke-width="1" />
  <text x="600" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">BAD: Large High-Frequency Loop</text>

  <rect x="550" y="100" width="100" height="80" fill="none" stroke="black" stroke-width="2" />
  <text x="600" y="145" text-anchor="middle" font-family="sans-serif" font-size="14">IC</text>
  <text x="560" y="90" font-family="sans-serif" font-size="12">VDD</text>
  <text x="620" y="90" font-family="sans-serif" font-size="12">GND</text>

  <!-- Capacitor Far -->
  <rect x="560" y="220" width="80" height="10" fill="none" stroke="black" stroke-width="1" />
  <line x1="600" y1="220" x2="600" y2="230" stroke="black" stroke-width="2" />
  <text x="530" y="225" font-family="sans-serif" font-size="12">C</text>

  <!-- Current Loop Large -->
  <path d="M 570 100 L 570 210 L 630 210 L 630 100" fill="none" stroke="black" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke-dasharray="5,5" />

</svg>
